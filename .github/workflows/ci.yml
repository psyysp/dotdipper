name: CI

on:
  push:
    # Every branch, not just main. There is no `develop` branch, and the
    # branches actually in use (fix/*, cursor/*) got no run at all until
    # someone opened a pull request.
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Superseded pushes to the same branch stop consuming runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The toolchain version is part of the key: a target/ built by an
          # older compiler is not reusable after a toolchain bump.
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Install age (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Install age (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install age

      - name: Verify age installation
        run: |
          which age
          which age-keygen
          age --version

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Run ignored tests (with age)
        run: cargo test --locked --verbose -- --ignored --test-threads=1

      # Cargo.toml documents this configuration, and src/remote/mod.rs has
      # cfg(not(feature = ...)) arms that compile in no other one. --all-features
      # below enables everything and so can never reach them.
      - name: Build with no default features
        run: cargo build --locked --no-default-features

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Clippy with no default features
        run: cargo clippy --locked --no-default-features -- -D warnings

  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotdipper-${{ matrix.os }}
          path: target/release/dotdipper

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Refreshed weekly rather than pinned to a version. A hard pin looks
      # safer but is not: the advisory database moves forward independently,
      # and an older cargo-audit eventually cannot parse a newly published
      # advisory at all — 0.21 fails outright on RUSTSEC-2026-0180. Weekly
      # keeps the rebuild cost off almost every run while bounding staleness.
      - name: Week stamp for the cargo-audit cache
        id: stamp
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.stamp.outputs.week }}

      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation files exist
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f example-config.toml

      # This job used to assert only that two files existed, which no real
      # change could break. These are the claims that actually go stale.
      - name: The documented install command matches the published formula
        run: |
          set -euo pipefail
          grep -q 'brew install psyysp/dotdipper/dotdipper' README.md \
            || { echo "::error::README no longer documents the one-command install"; exit 1; }

      - name: Every config key in example-config.toml is one the code parses
        run: |
          set -euo pipefail
          MISSING=0
          # Commented-out keys in the example are the documentation for the
          # config format; a renamed field silently makes them lies.
          for key in $(grep -oE '^# *[a-z_]+ =' example-config.toml \
                        | sed 's/^# *//; s/ =//' | sort -u); do
            if ! grep -rq "\"$key\"\|pub $key" src/cfg/mod.rs; then
              echo "::warning::example-config.toml documents '$key', not found in src/cfg/mod.rs"
              MISSING=$((MISSING + 1))
            fi
          done
          echo "$MISSING documented key(s) had no obvious match in src/cfg/mod.rs"

      # Deliberately not "the CHANGELOG has a section for Cargo.toml's
      # version": auto-release bumps the version without touching the
      # CHANGELOG, so that check would turn main red after every automated
      # release. The release workflow enforces the stronger version at the
      # point where it matters — see the resolve job in release.yml.
      - name: CHANGELOG has somewhere to record the next release
        run: |
          set -euo pipefail
          grep -q '^## \[Unreleased\]' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [Unreleased] section"; exit 1; }
          echo "CHANGELOG has an [Unreleased] section"

      - name: Check for broken links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        continue-on-error: true
        with:
          use-quiet-mode: "yes"
          config-file: ".github/markdown-link-check-config.json"
