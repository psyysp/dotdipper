name: Release

on:
  push:
    tags:
      - "v*"
  # GitHub does not start a workflow from an event created with GITHUB_TOKEN,
  # so a tag pushed by auto-release.yml would not trigger the block above.
  # auto-release.yml now pushes with a deploy key, which does trigger it; this
  # input remains the manual path for rebuilding an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.8.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

# Least privilege by default. Only the jobs that publish ask for write.
permissions:
  contents: read

# A tag is released once. Two runs for the same tag would race on creating
# the release and on pushing the formula.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The single source of truth for what is being released.
  #
  # Every other job takes both the ref to build and the version string from
  # here. Each used to re-derive them from github.ref, which is a *branch*
  # ref under workflow_dispatch: a manual run built the tip of main while
  # labelling the assets with the tag, and the notes rendered
  # "refs/heads/main" into every download URL.
  resolve:
    name: Resolve release target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Resolve tag and version
        id: v
        env:
          # Via env, never direct interpolation: a workflow_dispatch input is
          # attacker-controlled text and must not be pasted into a script.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check out the tag itself
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Refuse to release a tag whose tree declares a different version
        env:
          EXPECTED: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::tag says $EXPECTED but Cargo.toml at that tag says $ACTUAL"
            exit 1
          fi
          echo "Releasing $EXPECTED from ${{ steps.v.outputs.tag }}"

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dotdipper-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dotdipper-aarch64-apple-darwin

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # Without restore-keys, every lockfile change is a total cold miss.
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        # --locked so the shipped binary comes from the committed lockfile
        # rather than whatever happens to resolve today.
        run: cargo build --release --locked --features s3,webdav --target ${{ matrix.target }}

      - name: Create tarball
        run: |
          set -euo pipefail
          mkdir -p release
          cp "target/${{ matrix.target }}/release/dotdipper" release/
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C release dotdipper
          shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: dotdipper-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            artifact_name: dotdipper-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            # The cc crate infers this prefix today. Setting it explicitly
            # keeps the build working if a dependency ever needs a C compiler
            # it cannot guess one for.
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --features s3,webdav --target "$TARGET"

      - name: Create tarball
        run: |
          set -euo pipefail
          mkdir -p release
          cp "target/${{ matrix.target }}/release/dotdipper" release/
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C release dotdipper
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  create-release:
    name: Create GitHub Release
    needs: [resolve, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/
          COUNT=$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 4 ]; then
            echo "::error::expected 4 tarballs, found $COUNT"
            exit 1
          fi

      - name: Verify every checksum before publishing
        run: |
          set -euo pipefail
          cd release-assets
          for f in *.tar.gz; do
            EXPECTED=$(awk '{print $1}' "$f.sha256")
            ACTUAL=$(sha256sum "$f" | awk '{print $1}')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::checksum mismatch for $f"
              exit 1
            fi
            echo "ok  $f"
          done

      - name: Generate release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cat > release_notes.md << EOF
          ## Dotdipper $TAG

          ### Installation

          #### Homebrew (macOS and Linux) - Recommended
          \`\`\`bash
          brew install psyysp/dotdipper/dotdipper
          \`\`\`

          #### Arch Linux (AUR)
          \`\`\`bash
          yay -S dotdipper
          \`\`\`

          #### Manual Download
          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS | Apple Silicon | [dotdipper-aarch64-apple-darwin.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$TAG/dotdipper-aarch64-apple-darwin.tar.gz) |
          | macOS | Intel | [dotdipper-x86_64-apple-darwin.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$TAG/dotdipper-x86_64-apple-darwin.tar.gz) |
          | Linux | x86_64 | [dotdipper-x86_64-unknown-linux-gnu.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$TAG/dotdipper-x86_64-unknown-linux-gnu.tar.gz) |
          | Linux | ARM64 | [dotdipper-aarch64-unknown-linux-gnu.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$TAG/dotdipper-aarch64-unknown-linux-gnu.tar.gz) |

          ### Checksums
          A SHA-256 sidecar accompanies every binary, and each is verified
          against its artifact before this release is published.

          ### What's Changed
          See the [CHANGELOG](https://github.com/psyysp/dotdipper/blob/main/CHANGELOG.md) for details.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit. Without it the action falls back to github.ref, which
          # under workflow_dispatch is a branch: it would create a second,
          # bogus release and attach the binaries to that instead.
          tag_name: ${{ needs.resolve.outputs.tag }}
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: [resolve, create-release]
    runs-on: ubuntu-latest
    if: needs.resolve.outputs.prerelease == 'false'
    env:
      TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

    steps:
      - name: Fail loudly when the tap key is missing
        if: env.TAP_SSH_KEY == ''
        run: |
          echo "::error::HOMEBREW_TAP_SSH_KEY is not configured, so the tap was NOT updated."
          echo "Homebrew users would keep getting the previous version while this job reported success."
          exit 1

      - name: Checkout dotdipper at the tag (for the formula generator)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          path: dotdipper-src

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: psyysp/homebrew-dotdipper
          # A deploy key scoped to this one repository. A PAT cannot be
          # scoped that way, and GITHUB_TOKEN cannot reach another repo.
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          path: homebrew-tap

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update formula
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Generate to a temp file first. The shell performs `>` redirection
          # before running the command, so writing straight into the formula
          # truncates it to zero bytes whenever the generator fails.
          dotdipper-src/scripts/gen-formula.sh \
            --version "$VERSION" \
            --checksums artifacts \
            > formula.new

          grep -q 'on_macos do' formula.new || { echo "::error::formula lost macOS support"; exit 1; }
          grep -q 'on_linux do' formula.new || { echo "::error::formula lost Linux support"; exit 1; }
          grep -q "version \"$VERSION\"" formula.new || { echo "::error::formula version is wrong"; exit 1; }

          mv formula.new homebrew-tap/Formula/dotdipper.rb
          echo "Formula updated:"
          cat homebrew-tap/Formula/dotdipper.rb

      - name: Commit and push
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "dotdipper-release"
          git config user.email "dotdipper-release@users.noreply.github.com"
          git add Formula/dotdipper.rb
          if git diff --staged --quiet; then
            echo "Formula already current; nothing to commit."
            exit 0
          fi
          git commit -m "Update dotdipper to ${VERSION}"
          git push

  publish-crates:
    name: Publish to crates.io
    needs: [resolve, create-release]
    runs-on: ubuntu-latest
    if: needs.resolve.outputs.prerelease == 'false'
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Decide whether to publish
        id: gate
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; not publishing to crates.io."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the tagged commit
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust
        if: steps.gate.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      # The token is read from the environment, never passed as an argument.
      # Arguments are visible in the process list to anything else running in
      # the job, and log masking does not cover that.
      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        run: cargo publish --locked
