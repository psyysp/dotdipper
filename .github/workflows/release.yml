name: Release

on:
  push:
    tags:
      - "v*"
  # GitHub does not start a workflow from an event created with
  # GITHUB_TOKEN, so the tag auto-release.yml pushes does NOT trigger the
  # block above. Without this, an automated bump produces a tag with no
  # binaries attached. Re-pushing the tag by hand works because that push
  # comes from a real account; this input is the same thing without the
  # tag surgery.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.8.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dotdipper-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dotdipper-aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --features s3,webdav --target ${{ matrix.target }}

      - name: Create tarball
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/dotdipper release/
          cd release
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz dotdipper
          cd ..
          shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: dotdipper-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            artifact_name: dotdipper-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --features s3,webdav --target ${{ matrix.target }}

      - name: Create tarball
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/dotdipper release/
          cd release
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz dotdipper
          cd ..
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat > release_notes.md << EOF
          ## Dotdipper $VERSION

          ### Installation

          #### macOS (Homebrew) - Recommended
          \`\`\`bash
          brew tap psyysp/dotdipper
          brew install dotdipper
          \`\`\`

          #### Arch Linux (AUR)
          \`\`\`bash
          yay -S dotdipper
          # or
          yay -S dotdipper-bin
          \`\`\`

          #### Cargo (Rust)
          \`\`\`bash
          cargo install dotdipper
          \`\`\`

          #### Manual Download
          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS | Apple Silicon | [dotdipper-aarch64-apple-darwin.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$VERSION/dotdipper-aarch64-apple-darwin.tar.gz) |
          | macOS | Intel | [dotdipper-x86_64-apple-darwin.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$VERSION/dotdipper-x86_64-apple-darwin.tar.gz) |
          | Linux | x86_64 | [dotdipper-x86_64-unknown-linux-gnu.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$VERSION/dotdipper-x86_64-unknown-linux-gnu.tar.gz) |
          | Linux | ARM64 | [dotdipper-aarch64-unknown-linux-gnu.tar.gz](https://github.com/psyysp/dotdipper/releases/download/$VERSION/dotdipper-aarch64-unknown-linux-gnu.tar.gz) |

          ### Checksums
          SHA256 checksums are provided for all binaries.

          ### What's Changed
          See the [CHANGELOG](https://github.com/psyysp/dotdipper/blob/main/CHANGELOG.md) for details.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref, '-rc') || contains(inputs.tag || github.ref, '-beta') || contains(inputs.tag || github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: create-release
    runs-on: ubuntu-latest
    if: ${{ !contains(inputs.tag || github.ref, '-rc') && !contains(inputs.tag || github.ref, '-beta') && !contains(inputs.tag || github.ref, '-alpha') }}
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Skip notice when tap token is missing
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."

      - name: Checkout dotdipper (for the formula generator)
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          path: dotdipper-src

      - name: Checkout tap repository
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: psyysp/homebrew-dotdipper
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download macOS artifacts
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION=${RELEASE_VERSION}
          # One generator, shared with scripts/update-formula.sh. This step
          # used to carry its own macOS-only copy of the template, which
          # meant a release would silently drop Linux support added by hand.
          dotdipper-src/scripts/gen-formula.sh \
            --version "$VERSION" \
            --checksums artifacts \
            > homebrew-tap/Formula/dotdipper.rb

          echo "Formula updated:"
          cat homebrew-tap/Formula/dotdipper.rb

      - name: Commit and push
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dotdipper.rb
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update dotdipper to ${RELEASE_VERSION}"
          git push

  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    if: ${{ !contains(inputs.tag || github.ref, '-rc') && !contains(inputs.tag || github.ref, '-beta') && !contains(inputs.tag || github.ref, '-alpha') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
