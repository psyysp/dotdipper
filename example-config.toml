# Dotdipper Configuration Example
# This demonstrates the full feature set

[general]
default_mode = "symlink"  # Default restoration mode: "symlink" or "copy"
backup = true             # Create backups before overwriting files
active_profile = "default"  # Active profile store under profiles/<name>/
tracked_files = [
    "~/.zshrc",
    "~/.bashrc", 
    "~/.gitconfig",
    "~/.config/nvim",
    "~/.tmux.conf",
    "~/.ssh/config"
]

[github]
username = "your-github-username"
repo_name = "dotfiles"
# Optional branch override. Unset: "main" for the default profile, else "dotdipper/<name>".
# branch = "main"
private = true

[packages]
# Common packages for all systems
common = ["git", "vim", "tmux", "curl", "wget", "ripgrep", "fd-find"]

# macOS specific
macos = ["homebrew/cask/iterm2", "neovim", "fzf", "bat"]

# Linux common
linux = ["build-essential", "neovim"]

# Ubuntu/Debian specific
ubuntu = ["apt-transport-https"]

# Arch specific
arch = ["base-devel", "neovim"]

# File-specific overrides
[files."~/.config/nvim"]
mode = "copy"  # Copy nvim config instead of symlinking

[files."~/.ssh/config"]
exclude = true  # Don't restore SSH config (too sensitive)

[files."~/.gitconfig"]
mode = "copy"  # Copy git config to allow local modifications

# macOS application capture (ignored on Linux)
# [apps]
# capture_on_push = true      # dump Brewfile + apps_manifest.toml during `dotdipper push`
# scan_applications = true    # scan /Applications and ~/Applications
# promote_unmanaged = true    # add matching Homebrew casks / MAS ids to the Brewfile

# Secrets encryption (age or SOPS+age)
[secrets]
provider = "age"  # "age" or "sops" (sops CLI required for sops)
key_path = "~/.config/age/keys.txt"
# recipients = ["age1qq..."]  # optional multi-machine SOPS recipients

# Hooks (run scripts at specific points)
[hooks]
pre_apply = ["echo 'Starting apply'"]
post_apply = ["tmux source-file ~/.tmux.conf || true"]
pre_snapshot = []
post_snapshot = []

# Daemon configuration (opt-in feature)
# The daemon watches your dotfiles and creates snapshots when changes are detected.
# This is useful if you want automatic backups without manual intervention.
# 
# WARNING: The daemon runs in the foreground and consumes system resources.
# Only enable if you want automatic file watching.
#
# [daemon]
# enabled = true          # Set to true to enable the daemon
# mode = "ask"            # "ask" = prompt before snapshot, "auto" = auto-snapshot
# debounce_ms = 1500      # Wait time (ms) after last change before processing

# Auto-pruning configuration
# Automatically prune old snapshots after creating new ones.
# This helps manage disk space by removing old snapshots based on configurable criteria.
# Snapshots are kept if they match ANY of the criteria (keep_count OR keep_age OR keep_size).
#
# [auto_prune]
# enabled = true          # Set to true to enable auto-pruning
# keep_count = 10         # Keep the 10 most recent snapshots
# keep_age = "30d"        # Keep snapshots from the last 30 days (supports: d=days, w=weeks, m=months, h=hours)
# keep_size = "1GB"       # Keep snapshots until total size exceeds 1GB (not yet implemented)

# Remote backup configuration
# Supports LocalFS, S3, and WebDAV backends for cloud backups.
# Use `dotdipper remote set <type>` to configure.
#
# LocalFS example:
# [remote]
# kind = "localfs"
# endpoint = "~/dotfiles-backup"
#
# S3 example (requires --features s3):
# [remote]
# kind = "s3"
# bucket = "my-dotdipper"
# prefix = "profiles/default"
# region = "us-east-1"
#
# WebDAV example (requires --features webdav):
# [remote]
# kind = "webdav"
# endpoint = "https://cloud.example.com/remote.php/webdav"

# Include patterns (what to discover)
include_patterns = [
    "~/.config/**",
    "~/.zshrc",
    "~/.bashrc",
    "~/.profile",
    "~/.gitconfig",
    "~/.vimrc",
    "~/.tmux.conf",
]

# Exclude patterns (safety defaults)
exclude_patterns = [
    "~/.ssh/**",
    "~/.gnupg/**",
    "**/*.key",
    "**/*.pem",
    "**/node_modules/**",
    "**/cache/**",
    "**/Cache/**",
    "~/.Trash/**",
]

# Per-profile overlay lives at profiles/<name>/config.toml
# Overlay keys win over this file. Example:
#
# [github]
# repo_name = "dotfiles-work"
# branch = "dotdipper/work"
#
# [general]
# tracked_files = ["~/.zshrc"]


# ---------------------------------------------------------------------------
# Sanitized public mirror (`dotdipper publish`)
# ---------------------------------------------------------------------------
# The private repo above keeps everything a restore needs, including
# .ssh/config, .gitconfig and the Brewfile. Those are exactly the files you
# cannot make public, so `publish` derives a second, separate repository from
# the same store.
#
# Flow:
#   dotdipper publish --review    # generate public-allowlist.toml, then read it
#   dotdipper publish --dry-run   # see the plan
#   dotdipper publish             # push the sanitized mirror
#
# Only paths listed in the allowlist are published, so a dotfile captured after
# your last review is withheld until you review again. On top of that, every
# publish scans the finished tree for secrets and PII and aborts on any hit.

# [github]
# public_repo_name = "dotfiles-public"   # must differ from repo_name

# [public]
# Paths never published, whatever the allowlist says. Brewfile and
# apps_manifest.toml are excluded by default because the generated install
# script replaces them; see apps_script below.
# exclude = [".ssh/**", "manifest.lock", ".gitignore", "Brewfile", "apps_manifest.toml"]
#
# Publish a generated install script in place of the captured Brewfile and
# apps manifest. It installs the same taps, formulae, casks, and App Store
# titles without reproducing the machine name, the capture time, the exact
# installed version of everything, or applications installed by hand. Set to
# false to publish the two files as they are.
# apps_script = true
# apps_script_path = "install-apps.sh"
#
# Built-in redactors: git identity (including commented-out lines), captured
# hostname, SSH endpoints, Tailscale MagicDNS names, absolute home paths
# (rewritten to $HOME), email addresses, and the literal identity terms read
# from your environment (username, $USER, github.username, hostname).
# builtin_redactors = true
#
# Where the generated allowlist lives, relative to the dotdipper base dir.
# allowlist = "public-allowlist.toml"
#
# Scanner findings you have reviewed and accepted, by id.
# allow = []

# Project-specific redactions, applied after the built-ins.
# [[public.redact]]
# name = "license-key"
# path = "**/*.conf"                      # optional; omit for every file
# pattern = "(?m)^(license\\s*=\\s*).+$"
# replacement = "${1}<redacted>"
