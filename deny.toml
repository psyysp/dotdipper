# cargo-deny policy. Run locally with `cargo deny check`; CI runs the same
# checks in the "Dependency Policy" job.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained or yanked crates fail the check.
# Do not add ignores without a written reason and a tracking issue.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only, plus MPL-2.0 (file-level copyleft, used unmodified).
# Matches the licenses present in Cargo.lock at the time of writing.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
